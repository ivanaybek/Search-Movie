name: Ayaz Viewer

# Android uygulamasını derler, birim testlerini çalıştırır, kurulabilir APK üretir,
# emülatörde (Android 13 ve Android 15) cihaz testlerini ve yayın sürümü testini çalıştırır.
# İmzalama sırları (secrets) tanımlıysa Google Play'e yüklenecek imzalı AAB'yi de üretir.
# Ayrıntılar: AyazViewer/YAYINLAMA.md
on:
  push:
    paths:
      - "AyazViewer/**"
      - ".github/workflows/ayaz-viewer.yml"
  pull_request:
    paths:
      - "AyazViewer/**"
      - ".github/workflows/ayaz-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ayaz-viewer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: AyazViewer

jobs:
  build:
    name: Derleme, birim testleri ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK bileşenleri
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: XLSX motoru birim testleri
        run: ./gradlew --no-daemon --stacktrace :xlsx:test

      - name: Uygulama birim testleri
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Debug APK derle
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Cihaz testlerini derle
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebugAndroidTest

      - name: Yayın sürümü testlerini derle (staging + smoketest)
        run: ./gradlew --no-daemon --stacktrace :app:assembleStaging :smoketest:assembleStaging

      - name: Yayın imzası (sırlar tanımlıysa)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.AYAZ_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "İmzalama sırları tanımlı değil: AAB imzasız derlenecek (Play'e yüklenemez)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "AYAZ_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Yayın sürümü derle (APK + Google Play AAB, R8 ile küçültülmüş)
        env:
          AYAZ_KEYSTORE_PASSWORD: ${{ secrets.AYAZ_KEYSTORE_PASSWORD }}
          AYAZ_KEY_ALIAS: ${{ secrets.AYAZ_KEY_ALIAS }}
          AYAZ_KEY_PASSWORD: ${{ secrets.AYAZ_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: 16 KB sayfa boyutu uyumluluğu (Google Play zorunluluğu)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/staging/app-staging.apk
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > zipalign.txt || { cat zipalign.txt; echo "HATA: 16 KB hizalama"; exit 1; }
          rm -rf so && mkdir so && unzip -q -o "$APK" 'lib/*' -d so || true
          bad=0
          for f in $(find so -name '*.so'); do
            for a in $(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}'); do
              if [ $((a)) -lt 16384 ]; then echo "HATA: $f LOAD hizalaması $a"; bad=1; fi
            done
          done
          [ "$bad" = 0 ] && echo "Tüm yerel kitaplıklar 16 KB uyumlu."
          exit $bad

      - name: Yayın paketini doğrula ve hazırla
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p yayin
          cp app/build/outputs/bundle/release/app-release.aab "yayin/AyazViewer-$V.aab"
          cp app/build/outputs/apk/release/app-release*.apk "yayin/AyazViewer-$V-release.apk"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            "$BT/apksigner" verify --print-certs "yayin/AyazViewer-$V-release.apk" | head -3
            jarsigner -verify "yayin/AyazViewer-$V.aab" | tail -1
          fi
          (cd yayin && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: İmzalı yayın paketini yükle
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AyazViewer-yayin
          path: AyazViewer/yayin/
          if-no-files-found: error

      - name: APK doğrulama (izinler, imza, boyut)
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -la "$APK" app/build/outputs/apk/release/
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|uses-permission" | tee badging.txt
          if grep -q "android.permission.INTERNET" badging.txt; then echo "HATA: INTERNET izni bulundu"; exit 1; fi
          if grep -qE "READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE" badging.txt; then echo "HATA: geniş depolama izni"; exit 1; fi
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          cp "$APK" AyazViewer-debug.apk
          sha256sum AyazViewer-debug.apk | tee AyazViewer-debug.apk.sha256

      - name: Lint raporu
        if: always()
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: AyazViewer-debug-apk
          path: |
            AyazViewer/AyazViewer-debug.apk
            AyazViewer/AyazViewer-debug.apk.sha256
          if-no-files-found: error

      - name: Test ve lint raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-build
          path: |
            AyazViewer/xlsx/build/reports
            AyazViewer/app/build/reports
          if-no-files-found: ignore

  device-tests:
    name: Emülatör testleri (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [33, 35]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cihaz testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: AyazViewer
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Cihaz test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-device-api${{ matrix.api }}
          path: AyazViewer/app/build/reports/androidTests
          if-no-files-found: ignore

  release-smoke:
    name: Yayın sürümü testi ve mağaza ekran görüntüleri
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: KVM erişimi
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # R8 ile küçültülmüş sürüm (yayınla aynı kod) gerçek kullanıcı gibi kullanılır.
      # Ekran 1080x1920 (9:16): Google Play ekran görüntüsü kurallarına uygun.
      - name: Yayın sürümü uçtan uca testi
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: AyazViewer
          script: |
            ./gradlew --no-daemon :smoketest:connectedStagingAndroidTest || touch smoke_failed
            mkdir -p shots && adb pull /data/local/tmp/ayaz-shots shots/ || true
            test ! -f smoke_failed

      - name: Ekran görüntülerini yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: AyazViewer/shots/
          if-no-files-found: ignore

      - name: Yayın testi raporu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-release-smoke
          path: AyazViewer/smoketest/build/reports
          if-no-files-found: ignore

  publish-apk:
    name: APK ve ekran görüntülerini depoya ekle (testler geçtiyse)
    needs: [build, device-tests, release-smoke]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'ccr-3f76ce3b-m7oq72')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: AyazViewer-debug-apk
          path: AyazViewer
      - uses: actions/download-artifact@v4
        with:
          name: store-screenshots
          path: shots
      - name: İmzalı yayın paketini indir (varsa)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: AyazViewer-yayin
          path: AyazViewer/yayin
      - name: Depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f AyazViewer/AyazViewer-debug.apk AyazViewer/AyazViewer-debug.apk.sha256
          # Mağaza ekran görüntüleri (hata görüntüleri hariç)
          DEST=AyazViewer/magaza/ekran-goruntuleri
          mkdir -p "$DEST"
          find shots -name '[0-9]_*.png' -exec cp {} "$DEST/" \;
          git add -f "$DEST"
          if [ -d AyazViewer/yayin ]; then git add -f AyazViewer/yayin; fi
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi
          git commit -m "Update APK and store screenshots [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
